name: Build Windows Player

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./interactive-video

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./interactive-video/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./interactive-video/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app for Windows
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            interactive-video/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            interactive-video/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Upload portable executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: interactive-video/src-tauri/target/x86_64-pc-windows-msvc/release/tauri-app.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: true
          generate_release_notes: true
